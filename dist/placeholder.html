<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>El Coso 3000</title>
    <meta
      name="description"
      content="Image and video placeholder generator. PNG, JPEG, WebP and SVG images, animated GIF, AVI and ZIP sequences, and MP4, WebM, MOV and MKV video. Runs entirely in the browser, no server and no connection needed."
    />
    <meta name="generator" content="El Coso 3000" />
    <meta name="author" content="Matias Ezequiel Marani" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F0EDEB" />
    <link rel="canonical" href="https://maranimatias.github.io/el-coso-3000/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="El Coso 3000" />
    <meta property="og:description" content="Image and video placeholders, offline, free, with guaranteed contrast." />
    <meta property="og:url" content="https://maranimatias.github.io/el-coso-3000/" />
    <meta name="twitter:card" content="summary" />

    <style>
      /* el-coso-3000 — one single stylesheet, no framework.
   Everything goes through custom properties, so the light and the dark themes
   share the same structure. */

:root {
  /* Tono y saturación de la paleta elegida. La app los pisa sobre el `:root`
     en vivo al cambiar de color; la luminosidad y la fuerza del tinte las
     fija el CSS, así la interfaz se tiñe sin que su legibilidad dependa del
     color elegido. Los valores por defecto son los de la paleta rosa. */
  --tint-h: 350;
  --tint-s: 42%;

  --bg: hsl(var(--tint-h) calc(var(--tint-s) * 0.7) 96%);
  --surface: hsl(var(--tint-h) var(--tint-s) 99%);
  --surface-2: hsl(var(--tint-h) calc(var(--tint-s) * 0.8) 95%);
  --ink: #1c1a19;
  --ink-soft: #5d5754;
  --ink-faint: #8a8280;
  --line: hsl(var(--tint-h) calc(var(--tint-s) * 0.6) 87%);
  --accent: hsl(var(--tint-h) var(--tint-s) 30%);
  --accent-ink: #ffffff;
  --ok: #2f6f4e;
  --warn: #8a5a16;
  --bad: #a02b2b;
  --radius: 10px;
  --gap: 16px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: hsl(var(--tint-h) calc(var(--tint-s) * 0.3) 9%);
    --surface: hsl(var(--tint-h) calc(var(--tint-s) * 0.25) 13%);
    --surface-2: hsl(var(--tint-h) calc(var(--tint-s) * 0.25) 16%);
    --ink: #f2eeec;
    --ink-soft: #b8b0ad;
    --ink-faint: #8a8280;
    --line: hsl(var(--tint-h) calc(var(--tint-s) * 0.3) 23%);
    --accent: hsl(var(--tint-h) var(--tint-s) 70%);
    --accent-ink: #171514;
    --ok: #7fc9a3;
    --warn: #e0b872;
    --bad: #f09a9a;
  }
}

* {
  box-sizing: border-box;
}

/* `.group`, `.field` and `.choices label` set `display: flex` or `grid`, which
   overrides the `[hidden] { display: none }` the browser ships with. Without
   this, hiding a section with `el.hidden = true` does not hide it: it stays
   visible. The `!important` is the canonical fix. */
[hidden] {
  display: none !important;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font:
    15px/1.5 system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  -webkit-font-smoothing: antialiased;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.skip {
  position: absolute;
  left: -9999px;
}
.skip:focus {
  left: 8px;
  top: 8px;
  z-index: 10;
  background: var(--surface);
  color: var(--ink);
  padding: 8px 12px;
  border-radius: var(--radius);
}

/* ── Encabezado ─────────────────────────────────────────────────── */

.topbar {
  padding: 28px clamp(16px, 4vw, 40px) 8px;
}
.topbar h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.01em;
}
.tagline {
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 14px;
}

/* ── Distribución ───────────────────────────────────────────────── */

.layout {
  display: grid;
  grid-template-columns: minmax(300px, 380px) 1fr;
  gap: clamp(16px, 3vw, 32px);
  align-items: start;
  padding: 16px clamp(16px, 4vw, 40px) 40px;
  max-width: 1400px;
  margin: 0 auto;
}

@media (max-width: 860px) {
  .layout {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow: hidden;
}
.panel-body {
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding: 18px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

/* The action bar stays in view while the controls scroll, so the button that
   matters is never below the fold. Progress and messages live inside it, next
   to the thing that caused them. */
.dock {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 18px 18px;
  padding-bottom: max(18px, env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--line);
}

/* On a phone the page scrolls, not the panel. The preview is pinned to the top
   so every change is visible while the controls move under it, and the dock is
   pinned to the bottom. Sticky needs a flex parent here: inside a grid, an item
   cannot stick beyond its own grid area. */
@media (max-width: 860px) {
  .layout {
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .panel {
    position: static;
    max-height: none;
    overflow: visible;
  }
  .panel-body {
    overflow: visible;
  }
  .dock {
    position: sticky;
    bottom: 0;
    z-index: 4;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .preview {
    order: -1;
    position: sticky;
    top: 0;
    z-index: 5;
    gap: 6px;
    padding: 8px 0;
    background: var(--bg);
  }
  .stage {
    min-height: 0;
    padding: 12px;
  }
  #canvas {
    max-height: 30vh;
    max-height: 30dvh;
  }
  .meta-line {
    display: none;
  }
}

/* ── Secciones ──────────────────────────────────────────────────── */

.group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  border: 0;
  padding: 0;
  margin: 0;
}
.group h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
}

/* ── Tabs ───────────────────────────────────────────────────────── */

.tabs {
  display: flex;
  gap: 4px;
  background: var(--surface-2);
  padding: 4px;
  border-radius: var(--radius);
  border: 0;
}
.tab {
  flex: 1;
  position: relative;
}
.tab input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.tab span {
  display: block;
  text-align: center;
  padding: 10px 8px;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
}
.tab input:checked + span {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
}
.tab input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* ── Opciones tipo píldora ───────────────────────────────────────── */

.choices {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.choices label {
  position: relative;
}
.choices input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.choices span {
  display: flex;
  align-items: center;
  min-height: 36px;
  padding: 6px 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  user-select: none;
}
.choices input:checked + span {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--ink);
  font-weight: 500;
}
.choices input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.choices input:disabled + span {
  opacity: 0.35;
  cursor: not-allowed;
}

/* ── Campos ─────────────────────────────────────────────────────── */

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.field > label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 13px;
  color: var(--ink-soft);
}
.field output {
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  font-weight: 500;
}
.hint {
  font-size: 11px;
  color: var(--ink-faint);
  font-weight: 400;
}

input[type="number"],
select {
  width: 100%;
  padding: 8px 10px;
  font: inherit;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 7px;
}
input[type="color"] {
  width: 100%;
  height: 36px;
  padding: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  cursor: pointer;
}
input:disabled[type="color"] {
  cursor: not-allowed;
  opacity: 0.85;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

input:focus-visible,
select:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.derived {
  opacity: 0.9;
}

.dims {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto;
  gap: 8px;
  align-items: end;
}
.times {
  color: var(--ink-faint);
  padding-bottom: 9px;
}
/* The preset fills the whole row: its labels do not fit in a column of the
   grid without being cut. */
.preset {
  grid-column: 1 / -1;
}

.pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.checkboxes {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.checkboxes label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.checkboxes input {
  accent-color: var(--accent);
}

/* ── Color y contraste ──────────────────────────────────────────── */

.swatches {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
  gap: 6px;
}
.swatch {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 7px;
  cursor: pointer;
  padding: 0;
  overflow: hidden;
}
.swatch:hover {
  border-color: var(--ink-faint);
}
.swatch[aria-pressed="true"] {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.colors {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  align-items: end;
}

.contrast {
  display: flex;
  align-items: baseline;
  gap: 9px;
  padding: 9px 11px;
  background: var(--surface-2);
  border-radius: 7px;
  font-size: 13px;
}
.ratio {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.level {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 2px 6px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--ok) 20%, transparent);
  color: var(--ok);
}
.level[data-level="AAA"] {
  background: color-mix(in srgb, var(--ok) 28%, transparent);
}
.level[data-level="AA"] {
  background: color-mix(in srgb, var(--ok) 20%, transparent);
}
.level[data-level="AA-large"] {
  background: color-mix(in srgb, var(--warn) 20%, transparent);
  color: var(--warn);
}
.level[data-level="fail"] {
  background: color-mix(in srgb, var(--bad) 22%, transparent);
  color: var(--bad);
}
.levelnote {
  color: var(--ink-soft);
  font-size: 12px;
}

/* ── Botones ────────────────────────────────────────────────────── */

.actions {
  display: flex;
  gap: 8px;
}

button.primary {
  flex: 1;
  font: inherit;
  font-weight: 600;
  min-height: 44px;
  padding: 11px 16px;
  color: var(--accent-ink);
  background: var(--accent);
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
}
button.primary:hover {
  filter: brightness(1.08);
}
button.primary:disabled {
  opacity: 0.5;
  cursor: progress;
}

button.ghost {
  font: inherit;
  font-size: 13px;
  min-height: 40px;
  padding: 9px 12px;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
}
button.ghost:hover {
  color: var(--ink);
}

/* ── Progreso y mensajes ────────────────────────────────────────── */

.progress {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.progress .bar {
  height: 6px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
}
.progress .fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 999px;
  transition: width 120ms linear;
}
.progressText {
  margin: 0;
  font-size: 12px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.message {
  margin: 0;
  font-size: 13px;
  padding: 9px 11px;
  border-radius: 7px;
  background: color-mix(in srgb, var(--bad) 14%, transparent);
  color: var(--bad);
  border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent);
}
.message[data-tone="info"] {
  background: var(--surface-2);
  color: var(--ink-soft);
  border-color: var(--line);
}

.message[data-tone="success"] {
  background: color-mix(in srgb, var(--ok) 14%, transparent);
  color: var(--ok);
  border-color: color-mix(in srgb, var(--ok) 30%, transparent);
}

.note {
  margin: 0;
  font-size: 12px;
  color: var(--ink-soft);
}
.note.warning {
  color: var(--warn);
}

/* ── Vista previa ───────────────────────────────────────────────── */

.preview {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  min-width: 0;
}

.stage {
  width: 100%;
  min-height: 240px;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

#canvas {
  max-width: 100%;
  max-height: 62vh;
  max-height: 62dvh;
  display: block;
  box-shadow: 0 6px 24px rgb(0 0 0 / 0.12);
  border-radius: 2px;
}

.dims-label {
  margin: 0;
  font-size: 13px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.meta-line {
  margin: 0;
  font-size: 12px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  text-align: center;
}

/* ── Pie ────────────────────────────────────────────────────────── */

.footer {
  padding: 20px clamp(16px, 4vw, 40px) 32px;
  border-top: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 13px;
  text-align: center;
}
.footer p {
  margin: 0;
}
.footer .sub {
  color: var(--ink-faint);
  font-size: 12px;
  margin-top: 4px;
}
.footer a {
  color: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
    </style>
  </head>
  <body>
    <a class="skip" href="#panel">Skip to the controls</a>

    <header class="topbar">
      <h1>El Coso 3000</h1>
      <p class="tagline">Image and video placeholders. Runs in your browser, nothing is uploaded.</p>
    </header>

    <main class="layout">
      <!--
    The toolname / tooldescription / toolparamdescription attributes are the
    declarative WebMCP API: they turn this form into a tool an AI agent can
    operate without guessing. It is progressive enhancement: if the browser
    does not support WebMCP, the form stays a form.
  -->
      <form
        id="panel"
        class="panel"
        toolname="generate_placeholder"
        tooldescription="Configures and generates an image or video placeholder in the browser. Adjusts dimensions, pastel palette and contrast, and returns the downloaded file."
      >
        <div class="panel-body">
          <fieldset class="tabs">
            <legend class="visually-hidden">Output type</legend>
            <label class="tab">
              <input
                type="radio"
                name="kind"
                value="image"
                checked
                toolparamtitle="Output type"
                toolparamdescription="What to generate. Use 'image' for a still image, or 'video' for a looping output with a timeline: the four video containers plus the animated ones (gif, mjpeg-avi, jpeg-zip)."
              />
              <span>Image</span>
            </label>
            <label class="tab">
              <input
                type="radio"
                name="kind"
                value="video"
                toolparamtitle="Output type"
                toolparamdescription="What to generate. Use 'image' for a still image, or 'video' for a looping output with a timeline: the four video containers plus the animated ones (gif, mjpeg-avi, jpeg-zip)."
              />
              <span>Video</span>
            </label>
          </fieldset>

          <section class="group">
            <h2>Size</h2>
            <div class="dims">
              <div class="field">
                <label for="width">Width <span class="hint">px</span></label>
                <input
                  type="number"
                  id="width"
                  name="width"
                  min="1"
                  max="4096"
                  step="1"
                  value="1920"
                  toolparamtitle="Width"
                  toolparamdescription="Width in pixels, from 1 to 4096."
                />
              </div>
              <span class="times" aria-hidden="true">×</span>
              <div class="field">
                <label for="height">Height <span class="hint">px</span></label>
                <input
                  type="number"
                  id="height"
                  name="height"
                  min="1"
                  max="4096"
                  step="1"
                  value="1080"
                  toolparamtitle="Height"
                  toolparamdescription="Height in pixels, from 1 to 4096."
                />
              </div>
              <button
                type="button"
                id="swap"
                class="ghost"
                title="Swap width and height"
                aria-label="Swap width and height"
              >
                ⇅
              </button>
              <div class="field preset">
                <label for="presetSize">Preset</label>
                <select
                  id="presetSize"
                  toolparamtitle="Preset size"
                  toolparamdescription="Fills width and height with a standard ad size, for example 300x250. Any other size is Custom. Width and height are the real parameters."
                >
                  <option value="">Custom</option>
                  <optgroup label="Standard display">
                    <option value="300x250">Medium Rectangle — 300 × 250</option>
                    <option value="728x90">Leaderboard — 728 × 90</option>
                    <option value="160x600">Wide Skyscraper — 160 × 600</option>
                    <option value="336x280">Large Rectangle — 336 × 280</option>
                    <option value="300x600">Half Page / Filmstrip — 300 × 600</option>
                    <option value="120x600">Skyscraper — 120 × 600 (legacy)</option>
                    <option value="468x60">Main Banner / Full Banner — 468 × 60 (legacy)</option>
                  </optgroup>
                  <optgroup label="Mobile">
                    <option value="320x50">Mobile Leaderboard — 320 × 50</option>
                    <option value="320x100">Large Mobile Banner — 320 × 100</option>
                    <option value="320x480">Mobile Fullscreen / Interstitial — 320 × 480</option>
                    <option value="480x320">Mobile Fullscreen / Interstitial — 480 × 320</option>
                  </optgroup>
                  <optgroup label="High impact">
                    <option value="970x250">Billboard — 970 × 250</option>
                    <option value="970x90">Super Leaderboard / Pushdown — 970 × 90</option>
                    <option value="300x1050">Portrait — 300 × 1050</option>
                  </optgroup>
                </select>
              </div>
            </div>
            <p class="note warning" id="evenWarning" hidden></p>
          </section>

          <section class="group">
            <h2>Color</h2>
            <div class="swatches" id="swatches" role="group" aria-label="Pastel palette"></div>
            <div class="colors">
              <div class="field">
                <label for="bg">Background</label>
                <input
                  type="color"
                  id="bg"
                  name="bg"
                  value="#F0EDEB"
                  toolparamtitle="Background color"
                  toolparamdescription="Background color, in hex. The text is computed from it to guarantee contrast."
                />
              </div>
              <div class="field derived">
                <label for="fg">Text <span class="hint">automatic</span></label>
                <!-- Disabled on purpose: `readonly` does nothing on a color input, and the
                 contrast guarantee depends on this value never being edited by hand. -->
                <input
                  type="color"
                  id="fg"
                  name="fg"
                  value="#5B544D"
                  disabled
                  title="Derived from the background to guarantee the contrast"
                  toolparamtitle="Text color"
                  toolparamdescription="Derived automatically from the background color to guarantee WCAG contrast. It is not edited: changing the background recomputes this value. The text of the placeholder is the dimensions."
                />
              </div>
            </div>

            <div class="contrast" id="contrast" role="status" aria-live="polite">
              <span class="ratio" id="ratio">6.39:1</span>
              <span class="level" id="level">AA</span>
              <span class="levelnote" id="levelNote">meets WCAG AA</span>
            </div>
          </section>

          <section class="group" data-kind="image">
            <h2>Format</h2>
            <div class="choices" role="radiogroup" aria-label="Image format">
              <label
                ><input
                  type="radio"
                  name="imageFormat"
                  value="png"
                  checked
                  toolparamtitle="Image format"
                  toolparamdescription="PNG. Lossless with transparency. The most versatile."
                /><span>PNG</span></label
              >
              <label
                ><input
                  type="radio"
                  name="imageFormat"
                  value="jpeg"
                  toolparamtitle="Image format"
                  toolparamdescription="JPEG. No transparency, small size. For photos."
                /><span>JPEG</span></label
              >
              <label
                ><input
                  type="radio"
                  name="imageFormat"
                  value="webp"
                  toolparamtitle="Image format"
                  toolparamdescription="WebP. Transparency and smaller than PNG."
                /><span>WebP</span></label
              >
              <label
                ><input
                  type="radio"
                  name="imageFormat"
                  value="svg"
                  toolparamtitle="Image format"
                  toolparamdescription="SVG. Vector, weighs kilobytes. For icons and diagrams."
                /><span>SVG</span></label
              >
            </div>
            <p class="note format-hint" data-hint-for="imageFormat" aria-live="polite"></p>
          </section>

          <section class="group" data-kind="video" hidden>
            <h2>Format</h2>
            <div class="choices" role="radiogroup" aria-label="Output format">
              <label
                ><input
                  type="radio"
                  name="videoFormat"
                  value="mp4"
                  checked
                  toolparamtitle="Video format"
                  toolparamdescription="MP4 with H.264. The best compatibility possible."
                /><span>MP4</span></label
              >
              <label
                ><input
                  type="radio"
                  name="videoFormat"
                  value="webm"
                  toolparamtitle="Video format"
                  toolparamdescription="WebM with VP9. Better compression, less compatibility."
                /><span>WebM</span></label
              >
              <label
                ><input
                  type="radio"
                  name="videoFormat"
                  value="mov"
                  toolparamtitle="Video format"
                  toolparamdescription="QuickTime. Useful for an edit chain."
                /><span>MOV</span></label
              >
              <label
                ><input
                  type="radio"
                  name="videoFormat"
                  value="mkv"
                  toolparamtitle="Video format"
                  toolparamdescription="Matroska. A file container, it does not play in the browser."
                /><span>MKV</span></label
              >
              <label
                ><input
                  type="radio"
                  name="videoFormat"
                  value="gif"
                  toolparamtitle="Video format"
                  toolparamdescription="Animated GIF. The delay is quantized to hundredths, so the real FPS can differ from the requested one."
                /><span>GIF</span></label
              >
              <label
                ><input
                  type="radio"
                  name="videoFormat"
                  value="mjpeg-avi"
                  toolparamtitle="Video format"
                  toolparamdescription="AVI with Motion-JPEG. No browser plays it; it goes to an editor or to Photoshop."
                /><span>AVI</span></label
              >
              <label
                ><input
                  type="radio"
                  name="videoFormat"
                  value="jpeg-zip"
                  toolparamtitle="Video format"
                  toolparamdescription="ZIP with a numbered sequence of JPEG frames, for render pipelines."
                /><span>ZIP</span></label
              >
            </div>
            <p class="note format-hint" data-hint-for="videoFormat" aria-live="polite"></p>
            <p class="note warning" id="videoUnsupported" hidden></p>
          </section>

          <div class="field quality" hidden>
            <label for="quality">Quality <output id="qualityOut">90%</output></label>
            <input
              type="range"
              id="quality"
              name="quality"
              min="30"
              max="100"
              step="5"
              value="90"
              toolparamtitle="Quality"
              toolparamdescription="Compression quality, from 30 to 100. It only affects the lossy formats."
            />
          </div>

          <!--
      One single timeline section, shared by the video tab and the animated
      formats. It used to live inside the Video tab, which left the GIF with a
      single frame and no way to animate it, because the Image tab had nowhere
      to set the duration.
    -->
          <section class="group" id="timeline" hidden>
            <h2>Timeline</h2>
            <div class="pair">
              <div class="field">
                <label for="duration">Duration <span class="hint">s</span></label>
                <input
                  type="number"
                  id="duration"
                  name="duration"
                  min="1"
                  max="30"
                  step="1"
                  value="5"
                  toolparamtitle="Duration"
                  toolparamdescription="Duration in seconds, from 1 to 30."
                />
              </div>

              <div class="field">
                <label for="fps">FPS <span class="hint">frames/s</span></label>
                <input
                  type="number"
                  id="fps"
                  name="fps"
                  min="1"
                  max="60"
                  step="1"
                  value="15"
                  toolparamtitle="Frames per second"
                  toolparamdescription="Frames per second, from 1 to 60. The GIF only takes hundredth delays, so it can land on a different value."
                />
              </div>
            </div>

            <p class="note" id="fpsEffective" hidden></p>

            <div class="checkboxes">
              <label
                ><input
                  type="checkbox"
                  name="showProgressBar"
                  checked
                  toolparamtitle="Progress bar"
                  toolparamdescription="Draws a progress bar at the bottom of the placeholder. It only has an effect if the output has more than one frame."
                />
                <span>Progress bar</span></label
              >
              <label
                ><input
                  type="checkbox"
                  name="showTime"
                  checked
                  toolparamtitle="Show the time"
                  toolparamdescription="Draws the 0:03 / 0:10 clock over the progress bar. It only has an effect if the output has more than one frame."
                />
                <span>Show the time</span></label
              >
            </div>
          </section>
        </div>

        <div class="dock">
          <div class="actions">
            <button type="submit" class="primary" id="generate"><span id="generateLabel">Download</span></button>
            <button type="button" class="ghost" id="cancel" hidden>Cancel</button>
          </div>

          <div class="progress" id="progress" hidden>
            <div class="bar"><div class="fill" id="progressFill"></div></div>
            <p class="progressText" id="progressText" aria-live="polite">Preparing…</p>
          </div>

          <p class="message" id="message" role="status" hidden></p>
        </div>
      </form>

      <section class="preview" aria-label="Preview">
        <div class="stage" id="stage">
          <canvas id="canvas" role="img" aria-label="Preview of the placeholder"></canvas>
        </div>
        <p class="dims-label" id="dimsLabel">1920 × 1080</p>
        <p class="meta-line" id="metaLine"></p>
      </section>
    </main>

    <footer class="footer">
      <p>
        <a href="https://github.com/MaraniMatias/el-coso-3000" id="repoLink" rel="noopener">El Coso 3000</a>
      </p>
      <p class="sub" id="webmcpStatus" hidden></p>
    </footer>
